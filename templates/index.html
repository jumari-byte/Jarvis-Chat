<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='atom-one-dark.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
  <div id="flash-message-container"></div>
  <div class="container">
    <div class="chat-header">
      <h1>Jarvis</h1>
      <div>
        <form action="/reset" method="post" id="reset_form" style="display: inline;">
          <button type="submit">Reset</button>
        </form>
        <button id="settings-button" type="button">
          <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <g stroke="#e0e0e0" stroke-width="2" stroke-linecap="round">
              <path d="M3 4h13M3 9h18M3 14h10M3 19h16"/>
              <circle cx="19" cy="4" r="2"/>
              <circle cx="13" cy="14" r="2"/>
              <circle cx="05" cy="19" r="2"/>
            </g>
          </svg>
        </button>
      </div>
    </div>
    <form action="/stream" method="post" id="query-form">
      <input type="hidden" name="disable_search" id="disable_search_hidden" value="false">
      <div id="assistant-prompt-wrapper" style="display: none;">
        <div class="settings-column">
          <label for="model_select">Model:</label>
          <select id="model_select" name="model_select">           
            <option value="Meta-Llama-3.1-405B-Instruct">(Meta) Llama 3.1 405B Instruct</option>
            <option value="hf:meta-llama/Llama-3.3-70B-Instruct">(Meta) Llama-3.3-70B-Instruct</option>
            <option value="llama-3.3-70b">(Meta) llama-3.3-70b (cerebras)</option>
            <option value="hf:nvidia/Llama-3.1-Nemotron-70B-Instruct-HF">(Nvidia) Llama-3.1-Nemotron-70B-instruct</option>
            <option value="hf:Qwen/Qwen2.5-72B-Instruct">(Qwen) Qwen2.5 - 72b -Instruct</option>
            <option value="hf:Qwen/Qwen2.5-Coder-32B-Instruct">(Qwen) Qwen2.5-Coder-32B-Instruct</option>
            <option value="pixtral-large-latest">(Mistral) Pixtral large </option>
            <option value="mistral-large-latest">(Mistral) Mistral large 2 </option>
            <option value="mistral-small-latest" selected>(Mistral) Mistral Small 3 </option>
            <option value="gemini-2.0-flash">(Google) Gemini-2.0-Flash </option>
            <option value="gemini-2.0-flash-lite-preview-02-05">(Google) Gemini-2.0-Flash - Lite </option>
            <option value="gemini-2.0-flash-thinking-exp-01-21">(Google) Gemini-2.0-Flash-Thinking </option>
          </select>

          <div class="auto-tts-container">
            <label for="disable_search">Web Search:</label>
            <div class="spacer"></div>
            <label class="switch">
              <input type="checkbox" id="disable_search" name="disable_search" checked>
              <span class="slider round"></span>
            </label>
          </div>
          <div class="auto-tts-container">
            <label for="auto_tts">Auto TTS:</label>
            <div class="spacer"></div>
            <label class="switch">
              <input type="checkbox" id="auto_tts" name="auto_tts">
              <span class="slider round"></span>
            </label>
          </div>
          <label for="tts_language">Text-to-Speech Language:</label>
          <select id="tts_language" name="tts_language">
            <option value="id-ID">Bahasa Indonesia</option>
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="ja-JP">Japanese</option>
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="ko-KR">Korean</option>
          </select>

          <label for="assistant_prompt">Assistant Prompt:</label>
          <textarea
            id="assistant_prompt"
            name="assistant_prompt"
            rows="9"
            placeholder="Enter assistant prompt...">{{ assistant_prompt }}</textarea>
        </div>
      </div>
      <div class="chat-area" id="chat_area">
        {% for message in conversation %}
          {% if message.role == 'user' %}
            <div class="message user-message">{{ message.content }}</div>
          {% elif message.role == 'assistant' %}
            <div class="message assistant-message initial-content">{{ message.content|safe }}</div>
          {% endif %}
        {% endfor %}
      </div>
      <input type="hidden" id="conversation_history" name="conversation_history" value="[]">
    </form>
  </div>

  <div class="input-wrapper">
    <div class="input-container">
      <div id="pdf-info" style="display: none;">
        <span id="pdf-filename"></span>
        <button id="remove-pdf" type="button">x</button>
      </div>
      <div class="input-row">
        <button id="attach-button" type="button" data-tooltip="Upload PDF or Image">
          <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.586 10.461l-10.05 10.075c-1.95 1.949-5.122 1.949-7.071 0s-1.95-5.122 0-7.072l10.628-10.585c1.17-1.17 3.073-1.17 4.243 0 1.17 1.17 1.17 3.072 0 4.242l-8.507 8.464c-.39.39-1.024.39-1.414 0s-.39-1.024 0-1.414l7.093-7.05-1.415-1.414-7.093 7.049c-1.17 1.17-1.17 3.073 0 4.243 1.17 1.17 3.072 1.17 4.242 0l8.507-8.464c1.95-1.95 1.95-5.123 0-7.072-1.95-1.949-5.123-1.949-7.072 0L3.039 13.063c-2.73 2.729-2.73 7.17 0 9.9 2.73 2.729 7.17 2.729 9.9 0l10.05-10.075-1.414-1.414z" fill="#e0e0e0"/>
          </svg>
        </button>
        <input type="file" id="file-upload" name="file" accept=".pdf, .png, .jpg, .jpeg" style="display: none;">
        <textarea
          id="user_input"
          name="user_input"
          rows="1"
          placeholder="Type your message here..."
          required
          autofocus
        ></textarea>
        <button type="button" id="send-button" style="display: none;" data-tooltip="Send message">
          <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="#e0e0e0"/>
          </svg>
        </button>
        <button id="start-recording" type="button" data-tooltip="Talk to Jarvis">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
        </button>
        <button id="stop-recording" type="button" style="display: none;" data-tooltip="Stop talk and send to Jarvis">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <rect x="8" y="8" width="8" height="8" fill="white"/>
          </svg>
        </button>      
      </div>
    </div> 
  </div>
  <div id="loading-indicator" style="display: none;">Uploading...</div>
  <script src="{{ url_for('static', filename='highlight.min.js') }}"></script>
  <script src="{{ url_for('static', filename='marked.min.js') }}"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const modelSelect = document.getElementById('model_select');
    // Set initial value from session
    modelSelect.value = "{{ selected_model }}";
  </script>
</body>
</html>
